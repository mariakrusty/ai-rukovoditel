      <h1>AI-руководитель цветочного магазина</h1>
      <p>Курс-внедрение Марии Андреевой: за 9 уроков вы соберёте шесть AI-помощников
      для ассортимента, закупки, денег, продаж, команды и процессов — и будете принимать
      решения по данным, а не по интуиции. Подходит офлайн-, онлайн- и смешанному формату.</p>
      <p>Автор — <a href="https://mfandreeva.ru/" rel="author">Мария Андреева</a>,
      авторизованный партнёр МойСклад
      (<a href="https://www.klerk.ru/blogs/moysklad/611108/" rel="external">подтверждение статуса — Клерк.ру</a>).
      Опубликовано <time datetime="2026-08-28">28 августа 2026</time> ·
      Обновлено <time datetime="2026-08-31">31 августа 2026</time>.</p>
      <h2>Когда стартует курс?</h2>
      <p>5 октября 2026 в 11:00 мск. Внедрение занимает 9 месяцев, записи уроков доступны до 5 октября 2027.</p>
      <h2>Кому подходит курс?</h2>
      <p>Офлайн-магазинам, интернет-магазинам и смешанному формату: работа идёт не с сайтом
      или витриной, а с управленческими данными — продажами по каналам, обращениями,
      остатками, закупками и движением денег.</p>
      <h2>Что вы получите за 9 уроков?</h2>
      <p>Десять рабочих инструментов: ассортиментная матрица, анализ спроса и конкурентов,
      сравнение прайсов поставщиков, расчёт закупки, расчёт прибыли и расходов, платёжный
      календарь, анализ входящего потока и конверсии, план работы с клиентской базой,
      аудит квалификации команды, регламент и контроль процесса.</p>
      <h2>Можно ли не изучать самостоятельно?</h2>
      <p>Да. Есть <a href="https://mfandreeva.ru/ai-shtab-pod-klyuch/">индивидуальное
      внедрение под ключ</a>: Мария подключает данные магазина, настраивает AI-помощников
      и передаёт готовую систему управления.</p>
      <p>Для просмотра страницы включите JavaScript.</p>
